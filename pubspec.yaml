name: mandi_hisab
description: Production-ready stock accounting, goods movement, and vehicle tracking for Indian grain mandi shopkeepers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.19.7
  firebase_core: ^2.32.0
  firebase_storage: ^11.7.7
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.5
  intl: ^0.19.0
  pdf: ^3.10.8
  printing: ^5.13.1
  excel: ^4.0.3
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  razorpay_flutter: ^1.3.7
  uuid: ^4.4.0
  crypto: ^3.0.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
